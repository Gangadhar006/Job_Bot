  ai:
    retry:
      enabled: false
    google:
      genai:
        api-key: AIzaSyC_dxzsiMJY1Nutwck_vbyFxDIHU56uwro
        chat:
          options:
            model: gemini-2.5-flash-lite
#            model: gemini-3.1-flash-lite
            temperature: 0.3
            max-tokens: 1024

naukri:
  credentials:
    email: "puramgangadhar63@gmail.com"
    password: "hello006."
  browser:
    headless: false
    slowMo: 30   # ms delay between Playwright actions — helps avoid detection
  session:
    cookie-file: "session/naukri-cookies.json"
  scraper:
    keywords:
      #      - "java developer"
      #      - "java developer"
      #      - "Spring Boot Developer"
      #      - "Backend Developer"
      #      - "Backend Engineer"
      #      - "Software Engineer"
      - "Microservices Developer"
    #      - "Full Stack Developer"
    #      - "Software Developer"
    #      - "Java Software Engineer"
    #      - "Java Backend Developer"
    #      - "Java Microservices Developer"
    #      - "Java Spring Developer"
    #      - "Java Spring Boot Developer"
    #      - "Java Software Developer"
    locations:
      - "Bangalore"
    #      - "Hybrid"
    #      - "Remote"
    experience-min: 2           # years
    experience-max: 5
    pages-per-keyword: 1        # Naukri shows 20 jobs/page → total jobs = keywords * locations * pages * 20
    jd-fetch-delay-min: 2000    # ms between opening each JD tab
    jd-fetch-delay-max: 1000

  scoring:
    min-score-threshold: 70       # jobs below this % are SKIPPED

    # Your actual skills — scoring weights them by tier
    skills:
      primary: # high weight — must-have for you
        - "Java"
        - "Spring Boot"
        - "Spring Framework"
        - "REST API"
        - "Microservices"
        - "Hibernate"
        - "JPA"
        - "Maven"
        - "Git"
      secondary: # medium weight — good to have
        - "Kafka"
        - "Redis"
        - "Docker"
        - "Kubernetes"
        - "AWS"
        - "PostgreSQL"
        - "MySQL"
        - "JUnit"
        - "Mockito"
        - "CI/CD"
        - "Jenkins"
      bonus: # low weight — nice extras
        - "GraphQL"
        - "MongoDB"
        - "Azure"
        - "GCP"
        - "Elasticsearch"
        - "gRPC"

    # Experience you have (for fit scoring)
    your-experience-years: 3.5

    # Preferred locations — exact matches score higher
    preferred-locations:
      #      - "Hyderabad"
      - "Remote"
      - "Hybrid"
      - "Work From Home"

    # Salary filter — skip roles below this (in LPA)
    min-salary-lpa: 9

    # Companies to never apply to
    blacklisted-companies:
      - "Maveric Systems Limited"
      - "Accenture"
      #      - "TCS"
      #      - "Wipro"
      - "Infosys"
    #      - "HCL"
    #      - "Cognizant"
    #      - "Tech Mahindra"

    # Title keywords that signal a bad fit — auto-skip
    blacklisted-title-keywords:
      - "PHP"
      - "Python Developer"
      - ".NET"
      - "Angular"
      - "React Developer"
      - "iOS"
      - "Android"
      - "QA"
      - "Tester"
      - "SAP"
      - "Salesforce"
      - "Mainframe"

  apply:
    resume-path: "resumes/Updated_Resume.pdf"
    max-applications-per-session: 20
    apply-delay-min: 3000   # ms delay between applications
    apply-delay-max: 5000

    #
    profile:
      total-experience-years: 3.5
      current-ctc-lpa: 7.17
      expected-ctc-lpa: 12.0
      notice-period-days: 0
      date_of_birth: 2000-03-10
      current-company: "Maveric Systems Limited"
      current-designation: "Software Development Engineer"
      hometown: "Bangalore/Bengalore/Bengaluru"
      willing-to-relocate: true
      gender: "Male"
      highest-qualification: "MCA"
      passing-year: 2022
      college: "Sri Venkateswara University"
